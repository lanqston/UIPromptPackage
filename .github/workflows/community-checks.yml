name: Community pause verification
on:
  pull_request:
permissions:
  contents: read
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/community-paused.spec.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: community-desktop-mobile-review
          path: test-results/
