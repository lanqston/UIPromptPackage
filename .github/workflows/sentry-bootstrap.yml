name: Prepare Sentry dependencies
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/sentry-bootstrap.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'codex/sentry-monitoring' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sentry-monitoring
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --save-exact @sentry/browser@11.4.0 @sentry/node@11.4.0
      - run: npm test
      - run: npm run check:syntax
      - run: npm run build
        env:
          PUBLIC_SENTRY_DSN: https://public@example.ingest.sentry.io/1
      - name: Commit generated dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Lock Sentry browser and server SDK dependencies"
          git push origin HEAD:codex/sentry-monitoring
