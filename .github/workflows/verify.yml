name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check:syntax

      - name: Build production site
        run: npm run build
        env:
          PUBLIC_SENTRY_DSN: https://public@o4512195501228032.ingest.us.sentry.io/4512195596386304

      - name: Install browser for monitoring verification
        run: npx playwright install --with-deps chromium

      - name: Verify browser reporting and privacy
        run: npx playwright test
